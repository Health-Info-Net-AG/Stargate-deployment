---
workflow:
  rules:
    # Historic CalVer build tags (vYYYY.MM.DD-HHMM, created by the since-removed
    # release_build job) must never start a pipeline: a build on such a tag would
    # release-tag itself again and loop (see canceled pipeline 98265).
    - if: '$CI_COMMIT_TAG =~ /^v\d{4}\.\d{2}\.\d{2}-\d{4}$/'
      when: never
    # Images are built from tags only - no branch pipelines.
    - if: $CI_COMMIT_TAG
    - when: never

stages:
  - build
  - release

execute_script:
  stage: build
  tags:
    - linux
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Running VM images build script..."
    - cd /data/vmimagebuilder
    - ./almaimage.sh
    - echo "VM images were built and uploaded to https://images.vereign.io/staging/"
    - curl -X POST "https://gitlab.hin-infra.ch/api/v4/projects/336/trigger/pipeline" -F token=$HIN_GITLAB_TRIGGER_TOKEN -F ref=main

# Release for the semver tag (vX.Y.Z) every image build is made from. Rolls
# up changes since the previous semver tag, ignoring the historic CalVer
# build tags (their -HHMM suffix fails the anchor). Runs in the same tag
# pipeline as the image build, after it succeeds.
release_milestone:
  stage: release
  tags:
    - linux
  variables:
    GIT_DEPTH: 0
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+$/'
  script:
    - git fetch --tags --force --quiet origin || true
    - .gitlab/generate-release-notes.sh milestone "${CI_COMMIT_TAG}" > release-notes.md
    - cat release-notes.md
    - |
      HTTP_STATUS=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
        --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --data-urlencode "tag_name=${CI_COMMIT_TAG}" \
        --data-urlencode "name=${CI_COMMIT_TAG}" \
        --data-urlencode "description@release-notes.md" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases")
      case "$HTTP_STATUS" in
        201) echo "Release ${CI_COMMIT_TAG} created." ;;
        409) echo "Release ${CI_COMMIT_TAG} already exists, skipping."; cat response.json ;;
        *)   echo "Release creation failed with HTTP ${HTTP_STATUS}:"; cat response.json; exit 1 ;;
      esac
