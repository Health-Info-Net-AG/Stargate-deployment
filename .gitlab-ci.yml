---
workflow:
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v\d{4}\.\d{2}\.\d{2}-\d{4}$/'
      when: never
    # Pushing a QA tag (-test or -dev in the name) deliberately starts nothing: the image is built by running the
    # pipeline on that tag from the UI, where the environment is chosen. A push has no form and would pick a default.
    - if: '$CI_COMMIT_TAG =~ /-(test|dev)/ && $CI_PIPELINE_SOURCE != "web"'
      when: never
    - if: $CI_COMMIT_TAG
    # Run pipeline, on a branch or a QA tag: starts build_test_image and nothing else. Branch pushes create none.
    - if: $CI_PIPELINE_SOURCE == "web"
    - when: never

# Prefilled inputs for the Run pipeline form, and ONLY that: a variable declared with `description` exists solely in
# a manually started pipeline. On a tag push these are undefined and GitLab drops the empty variable, so the
# downstream silently built its own prod/all defaults -- which is why a QA tag push now starts no pipeline at all.
# build_test_image restates both, because a form value is a pipeline variable and trigger:forward drops those.
variables:
  STARGATE_ENV:
    value: "dev"
    options: ["prod", "dev", "dev2"]
    description: "Config preset the test image seeds on first boot. `prod` is HIN and applies nothing. `dev`/`dev2` need a matching `docker-compose/config/environments/<env>.sh` on the ref you run this from. Test builds only: a release tag always builds `prod`."
  IMAGE_TARGETS:
    value: "hetzner proxmox"
    description: |
      Where the test image will be booted, space- or comma-separated. Only what is listed is built and mirrored;
      the default is what QA currently deploys to. `all` is the full customer set, ~15 min longer.

      - `hetzner` — the only artifact cluster-management-infra can import
      - `proxmox` — Proxmox or libvirt
      - `azure` — fixed-size VHD
      - `hyperv` — VHDX
      - `vmware` — OVA

stages:
  - build
  - manifest
  - release
  - trigger
  - hin

execute_script:
  stage: build
  # almaimage.sh is untracked and lives only on the runner, so what it reads from its environment cannot be reviewed
  # here. This file had no default variables before, so opting out removes nothing that ever reached this job.
  # inherit:variables covers default (YAML) variables only -- project variables and the predefined CI_* still arrive.
  inherit:
    variables: false
  # almaimage.sh works in fixed paths under /data/vmimagebuilder — one shared stargate-deployment clone it
  # `git checkout --force`s, and one stargate-images/ it `rm -rf`s. Two concurrent runs would therefore bake
  # one tag's content into another tag's artifacts, so they must never overlap.
  resource_group: vm_image_build
  tags:
    - linux
  rules:
    # Release tags only. A -test/-dev tag is a QA image build and skips the release side of the pipeline.
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /-(test|dev)/'
  script:
    - echo "Running VM images build script..."
    - cd /data/vmimagebuilder
    - ./almaimage.sh
    - echo "VM images were built and uploaded to https://images.vereign.io/"

# Milestone release for manually pushed/UI-created semver tags (v1.0.0).
# Rolls up changes since the previous semver tag.
generate_manifest:
  stage: manifest
  tags:
    - linux
  rules:
    # Release tags only. A -test/-dev tag is a QA image build and skips the release side of the pipeline.
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /-(test|dev)/'
  script:
    - |
      # Image versions now live in docker-compose.yml (pinned per git tag), not in
      # customer-config. This reads the tags back OUT of the compose image: lines so
      # the release manifest still records the exact versions a release shipped
      # (same manifest schema the dashboard/ops-agent consume). MAP is
      # "<MANIFEST_KEY> <image repo path in compose>"; keep it in sync with the
      # image: lines in docker-compose.yml.
      COMPOSE="docker-compose/docker-compose.yml"
      MAP="SMIMEKEYS_VERSION healthinfonetag/smimekeys
      POLICY_VERSION healthinfonetag/policy
      IRISAGENT_VERSION healthinfonetag/irisagent
      MXENGINE_VERSION healthinfonetag/mxengine
      POLICY_SYNC_VERSION healthinfonetag/policy-sync
      DASHBOARD_VERSION healthinfonetag/dashboard
      MTACONF_VERSION healthinfonetag/mtaconf
      OPS_AGENT_VERSION healthinfonetag/stargate-ops
      IDAGENT_VERSION healthinfonetag/idagent
      MAILAUTH_VERSION healthinfonetag/mailauth
      KERIOX_WATCHER_VERSION healthinfonetag/keriox-watcher
      DOZZLE_VERSION amir20/dozzle
      CLAMAV_VERSION clamav/clamav
      POSTGRES_VERSION postgres
      KEYCLOAK_VERSION quay.io/keycloak/keycloak
      VAULT_VERSION hashicorp/vault
      APISIX_VERSION apache/apisix
      NATS_VERSION nats
      SEAWEEDFS_VERSION chrislusf/seaweedfs
      CADDY_VERSION caddy
      LOKI_VERSION grafana/loki
      ALLOY_VERSION grafana/alloy
      NODE_EXPORTER_VERSION prom/node-exporter
      STALWART_VERSION stalwartlabs/stalwart
      OAUTH2_PROXY_VERSION quay.io/oauth2-proxy/oauth2-proxy"
      echo "{" > manifest.json
      echo "  \"version\": \"${CI_COMMIT_TAG}\"," >> manifest.json
      echo "  \"deployment_tag\": \"${CI_COMMIT_TAG}\"," >> manifest.json
      echo "  \"images\": {" >> manifest.json
      FIRST=true
      echo "$MAP" | while read -r KEY REPO; do
        [ -n "$KEY" ] || continue
        # tag = substring after the last ':' on the matching image: line
        VALUE=$(grep -E "^[[:space:]]*image:[[:space:]]*${REPO}:" "$COMPOSE" | head -1 | sed 's/.*://' | tr -d '[:space:]')
        if [ -n "$VALUE" ]; then
          if [ "$FIRST" = true ]; then FIRST=false; else echo "," >> manifest.json; fi
          printf "    \"%s\": \"%s\"" "$KEY" "$VALUE" >> manifest.json
        fi
      done
      echo "" >> manifest.json
      echo "  }" >> manifest.json
      echo "}" >> manifest.json
    - cat manifest.json
    # main is push-protected ("No one"), so CI cannot commit directly.
    # Instead: create a feature branch with the manifest and open an MR for a human to merge.
    # MR/branch failures are non-fatal on purpose - they must not break the (30+ min) release pipeline;
    # the manifest can be added by hand as a last resort.
    - |
      if [ -z "$MANIFEST_TOKEN" ]; then
        echo "WARNING: MANIFEST_TOKEN is empty - check the variable's 'Protected' flag vs Protected tags. Skipping manifest MR."
        exit 0
      fi
      BRANCH="manifest/${CI_COMMIT_TAG}"
      ENCODED=$(base64 -w0 manifest.json)

      echo "Creating ${BRANCH} with manifests/${CI_COMMIT_TAG}.json (off main)..."
      HTTP_STATUS=$(curl --silent --show-error --output commit_response.json --write-out "%{http_code}" \
        --request POST \
        --header "PRIVATE-TOKEN: ${MANIFEST_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "$(jq -n \
          --arg branch "$BRANCH" --arg start "main" \
          --arg msg "chore: add manifest for ${CI_COMMIT_TAG}" \
          --arg path "manifests/${CI_COMMIT_TAG}.json" \
          --arg content "$ENCODED" \
          '{branch: $branch, start_branch: $start, commit_message: $msg, actions: [{action: "create", file_path: $path, content: $content, encoding: "base64"}]}')" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/commits")
      case "$HTTP_STATUS" in
        201) echo "Branch + commit created." ;;
        400) echo "Branch/file may already exist (re-run?):"; cat commit_response.json ;;
        *)   echo "WARNING: commit failed (HTTP ${HTTP_STATUS}) - add the manifest manually:"; cat commit_response.json; exit 0 ;;
      esac

      echo "Opening MR ${BRANCH} -> main..."
      MR_STATUS=$(curl --silent --show-error --output mr_response.json --write-out "%{http_code}" \
        --request POST \
        --header "PRIVATE-TOKEN: ${MANIFEST_TOKEN}" \
        --header "Content-Type: application/json" \
        --data "$(jq -n \
          --arg src "$BRANCH" --arg tgt "main" \
          --arg title "chore: add manifest for ${CI_COMMIT_TAG}" \
          --arg desc "Automated manifest publish for ${CI_COMMIT_TAG}. Review & merge to expose it at manifests/${CI_COMMIT_TAG}.json on main." \
          '{source_branch: $src, target_branch: $tgt, title: $title, description: $desc, remove_source_branch: true}')" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests")
      case "$MR_STATUS" in
        201)     echo "MR created: $(jq -r .web_url mr_response.json)" ;;
        409|400) echo "MR may already exist:"; cat mr_response.json ;;
        *)       echo "WARNING: MR creation returned HTTP ${MR_STATUS} - open it manually:"; cat mr_response.json ;;
      esac
  artifacts:
    paths:
      - manifest.json

release_milestone:
  stage: release
  tags:
    - linux
  needs:
    - generate_manifest
  variables:
    GIT_DEPTH: 0
  rules:
    # Release tags only. A -test/-dev tag is a QA image build and skips the release side of the pipeline.
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /-(test|dev)/'
  script:
    - git fetch --tags --force --quiet origin || true
    - .gitlab/generate-release-notes.sh "${CI_COMMIT_TAG}" > release-notes.md
    - cat release-notes.md
    - |
      HTTP_STATUS=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
        --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --data-urlencode "tag_name=${CI_COMMIT_TAG}" \
        --data-urlencode "name=${CI_COMMIT_TAG}" \
        --data-urlencode "description@release-notes.md" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases")
      case "$HTTP_STATUS" in
        201) echo "Release ${CI_COMMIT_TAG} created." ;;
        409) echo "Release ${CI_COMMIT_TAG} already exists, skipping."; cat response.json ;;
        *)   echo "Release creation failed with HTTP ${HTTP_STATUS}:"; cat response.json; exit 1 ;;
      esac
    - |
      echo "Uploading manifest.json as release asset..."
      curl --silent --show-error \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --upload-file manifest.json \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/manifest/${CI_COMMIT_TAG}/manifest.json"
      curl --silent --show-error \
        --request POST \
        --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
        --data "name=manifest.json" \
        --data "url=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/manifest/${CI_COMMIT_TAG}/manifest.json" \
        "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/releases/${CI_COMMIT_TAG}/assets/links"

# needs: [] — builds from $CI_COMMIT_TAG alone, so it starts at pipeline creation and runs
# alongside execute_script instead of after it. A failed execute_script no longer blocks it.
trigger_bootc_pipeline:
  stage: trigger
  needs: []
  allow_failure: true
  rules:
    # Every tag except an explicit `-test` one, which goes to build_test_image below: release tag names
    # vary, so prod is the default. An unset tag matches !~, hence the presence check.
    - if: '$CI_COMMIT_TAG && $CI_COMMIT_TAG !~ /-(test|dev)/'
    # A Run pipeline on the default branch is a production build of current main, not a QA one -- the only way
    # to build from main at all, since a branch push creates no pipeline.
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_TAG == null && $CI_COMMIT_REF_NAME == $CI_DEFAULT_BRANCH'
  variables:
    # CI_COMMIT_REF_NAME, not CI_COMMIT_TAG: it is the tag name on a tag pipeline and the branch on a web run.
    STARGATE_REF: $CI_COMMIT_REF_NAME
    # Pinned, not inherited: a Run pipeline on a release tag would otherwise carry form values into a release.
    STARGATE_ENV: prod
    IMAGE_TARGETS: all
  trigger:
    project: svdh/almalinux-bootc
    branch: main
    strategy: depend


trigger_hin_pipeline:
  stage: hin
  tags:
    - linux
  needs:
    - trigger_bootc_pipeline
  rules:
    - if: '$CI_COMMIT_TAG =~ /^v[0-9]+\.[0-9]+\.[0-9]+$/'
  script:
    - echo "Stable release ${CI_COMMIT_TAG} - triggering HIN pipeline..."
    - curl -X POST "https://gitlab.hin-infra.ch/api/v4/projects/336/trigger/pipeline" -F token=$HIN_GITLAB_TRIGGER_TOKEN -F ref=main


# QA test images, built from the ref this pipeline ran on -- the Containerfile clones with `git clone --branch`,
# which takes a tag just as well. strategy: depend makes this job reflect the downstream build's status.
#
# Started only from the UI, on a branch or on a -test tag, so STARGATE_ENV/IMAGE_TARGETS always come from the form.
# That is the whole reason a QA tag push creates no pipeline -- see the note above the variables: block.
build_test_image:
  stage: trigger
  needs: []
  rules:
    # Any branch except the default one -- a run on main is a production build, handled above.
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_TAG == null && $CI_COMMIT_REF_NAME != $CI_DEFAULT_BRANCH'
    - if: '$CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_TAG =~ /-(test|dev)/'
  variables:
    # A tag pipeline sets CI_COMMIT_REF_NAME to the tag name, so this covers both rules.
    STARGATE_REF: $CI_COMMIT_REF_NAME
    STARGATE_ENV: $STARGATE_ENV
    IMAGE_TARGETS: $IMAGE_TARGETS
  trigger:
    project: svdh/almalinux-bootc
    branch: main
    strategy: depend
